services:
  db:
    image: postgres:17-alpine
    container_name: doctorhide_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctorhide}
      POSTGRES_USER: ${POSTGRES_USER:-doctorhide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doctorhide}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doctorhide}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doctorhide_net

  init:
    build: .
    container_name: doctorhide_init
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: doctorhide.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Required: compose fails fast if DJANGO_SUPERUSER_PASSWORD is unset.
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?set DJANGO_SUPERUSER_PASSWORD in .env to create the admin account}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_superuser"
    networks:
      - doctorhide_net

  app:
    build: .
    container_name: doctorhide_app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: doctorhide.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    networks:
      - doctorhide_net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: doctorhide_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - doctorhide_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: doctorhide_alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
    networks:
      - doctorhide_net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: doctorhide_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - doctorhide_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: doctorhide_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-doctorhide}:${POSTGRES_PASSWORD:-doctorhide}@db:5432/${POSTGRES_DB:-doctorhide}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - doctorhide_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  doctorhide_net:
    driver: bridge
