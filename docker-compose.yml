services:
  db:
    image: postgres:17-alpine
    container_name: doctorhide_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctorhide}
      POSTGRES_USER: ${POSTGRES_USER:-doctorhide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doctorhide}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doctorhide}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doctorhide_net

  init:
    build: .
    container_name: doctorhide_init
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: doctorhide.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Required: compose fails fast if DJANGO_SUPERUSER_PASSWORD is unset.
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?set DJANGO_SUPERUSER_PASSWORD in .env to create the admin account}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_superuser"
    networks:
      - doctorhide_net

  app:
    build: .
    container_name: doctorhide_app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: doctorhide.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    networks:
      - doctorhide_net

volumes:
  postgres_data:

networks:
  doctorhide_net:
    driver: bridge
