global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alert rules. The path is read by the Prometheus container at
# startup (see docker-compose.yml); the rule files are mounted into
# /etc/prometheus/.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: doctorhide
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
