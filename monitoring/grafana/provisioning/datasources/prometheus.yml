apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # ``prometheus:9090`` is the docker-compose service name. The Grafana
    # container reaches Prometheus over the internal doctorhide network.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
