{% extends "accounts/base.html" %}
{% block title %}Sign in — doctorhide{% endblock %}
{% block body %}
<div class="card-wrap">
<div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage your secrets.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.3rem;">Continue</button>
    </form>
    <p class="muted-link" style="margin-top:1.2rem;">No account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
</div>
</div>
{% endblock %}
