{% extends "accounts/base.html" %}
{% block title %}Two-factor — doctorhide{% endblock %}
{% block body %}
<div class="card-wrap">
<div class="card">
    <h1>Enter your code</h1>
    <p class="sub">Use the 6-digit code from your authenticator app, or a backup code.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'accounts:totp_verify' %}">
        {% csrf_token %}
        <label for="token">Code</label>
        <input type="text" id="token" name="token" inputmode="numeric" autocomplete="one-time-code" autofocus>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.3rem;">Verify</button>
    </form>
</div>
</div>
{% endblock %}
